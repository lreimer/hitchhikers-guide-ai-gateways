apiVersion: api.kagent.dev/v1alpha3
kind: Harness
metadata:
  name: kagent-byo-harness
  labels:
    app.kubernetes.io/managed-by: kagent-byo-addon
spec:
  byo: {}
  workload:
    image: __KAGENT_BYO_IMAGE__
    command: ["/usr/local/bin/kagent-byo"]
  substrate:
    workerPoolRef:
      name: kagent-default
    snapshotPolicy:
      location: s3://ate-snapshots/kagent/
