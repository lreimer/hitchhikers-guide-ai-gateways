apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: @@ENVOY_GATEWAY_NAMESPACE@@
  labels:
    app.kubernetes.io/managed-by: envoy-ai-gateway-demo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: envoy-ai-gateway-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: @@ENVOY_GATEWAY_NAMESPACE@@
  labels:
    app.kubernetes.io/managed-by: envoy-ai-gateway-demo
    app.kubernetes.io/name: envoy-ai-gateway-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: envoy-ai-gateway-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: envoy-ai-gateway-redis
    spec:
      containers:
        - name: redis
          image: docker.io/library/redis@sha256:a308ca111032fa8f306a2dc7be7ba5deb8b777ed5d258c733cddba48a1fd7904
          imagePullPolicy: IfNotPresent
          args:
            - redis-server
            - --save
            - ""
            - --appendonly
            - "no"
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
