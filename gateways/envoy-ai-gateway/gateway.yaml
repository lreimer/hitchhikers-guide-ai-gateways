apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy-ai-gateway-demo
  labels:
    app.kubernetes.io/managed-by: envoy-ai-gateway-demo
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: envoy-ai-gateway-demo
  namespace: @@ENVOY_AI_GATEWAY_NAMESPACE@@
  labels:
    app.kubernetes.io/managed-by: envoy-ai-gateway-demo
spec:
  gatewayClassName: envoy-ai-gateway-demo
  listeners:
    - name: http
      protocol: HTTP
      port: 80
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: envoy-ai-gateway-demo
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: envoy-ai-gateway-demo
  namespace: @@ENVOY_AI_GATEWAY_NAMESPACE@@
  labels:
    app.kubernetes.io/managed-by: envoy-ai-gateway-demo
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: ClusterIP
      envoyDeployment:
        container:
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: envoy-ai-gateway-client-key
  namespace: @@ENVOY_AI_GATEWAY_NAMESPACE@@
  labels:
    app.kubernetes.io/managed-by: envoy-ai-gateway-demo
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-ai-gateway-demo
  apiKeyAuth:
    credentialRefs:
      - group: ""
        kind: Secret
        name: envoy-ai-gateway-client-keys
    extractFrom:
      - headers:
          - x-api-key
