apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agentgateway-mcp
  labels:
    app.kubernetes.io/managed-by: agentgateway-mcp-demo
spec:
  parentRefs:
    - name: agentgateway-proxy
      sectionName: http
  rules:
    - matches:
        - path:
            type: Exact
            value: /mcp
      backendRefs:
        - name: agentgateway-mcp
          group: agentgateway.dev
          kind: AgentgatewayBackend
