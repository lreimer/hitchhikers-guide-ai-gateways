apiVersion: apps/v1
kind: Deployment
metadata:
  name: krakend
  labels:
    app.kubernetes.io/name: krakend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: krakend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: krakend
    spec:
      automountServiceAccountToken: false
      containers:
        - name: krakend
          image: krakend:3.0.3
          args:
            - run
            - -c
            - /etc/krakend/krakend.json
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /__health
              port: http
          livenessProbe:
            httpGet:
              path: /__health
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/krakend
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: krakend-config
---
apiVersion: v1
kind: Service
metadata:
  name: krakend
  labels:
    app.kubernetes.io/name: krakend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: krakend
  ports:
    - name: http
      port: 8080
      targetPort: http
